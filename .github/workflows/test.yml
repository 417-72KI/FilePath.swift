name: Test
on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - .github/create-matrix.sh
      - Package.*
      - Sources/**/*.swift
      - Tests/**/*.swift
      - .github/matrix.yml
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  extract-matrix:
    name: Create matrix
    runs-on: ubuntu-latest
    outputs:
      macos-versions: ${{ steps.extract-matrix.outputs.macos-versions }}
      linux-swift-versions: ${{ steps.extract-matrix.outputs.linux-swift-versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: extract-matrix
        run: |
          echo "macos-versions=$(.github/create-matrix.sh macOS)" >> $GITHUB_OUTPUT
          echo "linux-swift-versions=$(.github/create-matrix.sh Linux)" >> $GITHUB_OUTPUT
  test-macos:
    name: Test(macOS)
    needs: extract-matrix
    strategy:
      matrix:
        include: ${{ fromJson(needs.extract-matrix.outputs.macos-versions) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: create-destination-key
        name: Create destination key for cache
        run: echo "destination-key=$(echo "xcode_${{ matrix.xcode }}-${{ matrix.destination }}" | sed 's/[, ]/_/g')" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/SourcePackages
          key: ${{ runner.os }}-${{ matrix.xcode }}-${{ steps.create-destination-key.outputs.destination-key }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.xcode }}-${{ steps.create-destination-key.outputs.destination-key }}-
            ${{ runner.os }}-${{ matrix.xcode }}-
      - name: Enable macro and plugin
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: test
        run: |
          defaults write com.apple.dt.XCBuild EnableSwiftBuildSystemIntegration 1
          set -o pipefail && \
          xcrun xcodebuild \
            -enableCodeCoverage YES \
            -scheme "$(xcodebuild -list -json | jq -rc '.workspace.schemes[0] // .workspace.name')" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath '.build' \
            -resultBundlePath 'test_output/TestResult.xcresult' \
            clean test | xcpretty
      - name: Convert test result to JSON
        run: |
          mkdir -p test_output/json
          xcrun xcresulttool get test-results tests --path 'test_output/TestResult.xcresult' > 'test_output/result.json'
      - name: Upload test result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() || failure()
        with:
          name: ${{ steps.create-destination-key.outputs.destination-key }}
          path: test_output
          if-no-files-found: error
          retention-days: 1
  test-linux:
    name: Test(Linux)
    needs: extract-matrix
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      matrix:
        swift: ${{ fromJson(needs.extract-matrix.outputs.linux-swift-versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ matrix.swift }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.swift }}-
      - name: test
        run: swift test
  danger:
    name: Danger
    needs: [test-macos, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@v7
        with:
          path: test_output
      - name: Run Danger
        uses: 417-72KI/danger-swiftlint@v6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
